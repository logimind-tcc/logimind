<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="System Anomaly: o jogo de terror do projeto LogiMind, sobre uma anomalia no sistema da esteira."
    />
    <title>LogiMind | Jogo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="jogo.css" />
  </head>

  <body class="pagina-jogo">
    <!-- ===================== CABECALHO ===================== -->
    <header class="cabecalho">
      <div class="conteiner cabecalho-interno">
        <a class="marca" href="home.html" aria-label="LogiMind - página inicial">
          <img src="./pecas/logo.png" alt="Logotipo da LogiMind" />
          LOGIMIND
        </a>

        <nav class="navegacao" id="navegacao" aria-label="Navegação principal">
          <ul class="navegacao-lista">
            <li><a href="home.html">Home</a></li>
            <li><a href="instrucao.html">Instruções</a></li>
            <li><a href="produto.html">Produto</a></li>
            <li><a href="referencias.html">Referências</a></li>
            <li><a href="sobrenos.html">Sobre Nós</a></li>
            <li><a href="painel.html">Painel</a></li>
            <li><a class="ativo" href="jogo.html">Jogo</a></li>
            <li><a class="link-cadastro" href="home.html#cadastro">Cadastre-se</a></li>
          </ul>
        </nav>

        <div class="acoes-cabecalho">
          <button class="botao-tema" id="botao-tema" type="button" aria-label="Alternar entre tema claro e escuro">
            <svg class="icone-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icone-lua" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>

          <button class="botao-menu" id="botao-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navegacao">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="jogo-palco">
      <h1 class="somente-leitor">System Anomaly</h1>
      <!-- O jogo fica na pasta systemAnomaly/ e abre direto no menu -->
      <iframe
        id="jogoFrame"
        class="jogo-frame"
        src="systemAnomaly/index.html"
        title="System Anomaly"
        allow="fullscreen; autoplay"
        allowfullscreen
      ></iframe>
    </main>

    <script src="global.js"></script>
    <script>
      // Já deixa o jogo pronto para o teclado (ENTER, setas, WASD)
      const jogo = document.getElementById("jogoFrame");
      const focarJogo = () => {
        try {
          jogo.contentWindow.focus();
          jogo.contentDocument.getElementById("tela")?.focus();
        } catch (e) {}
      };
      jogo.addEventListener("load", focarJogo);
      jogo.addEventListener("mouseenter", focarJogo);
    </script>
  </body>
</html>
