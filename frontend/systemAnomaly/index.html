<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Anomaly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Dentro do site (página Jogo), o jogo ocupa todo o espaço, sem bordas nem texto embaixo
    if (window.self !== window.top) document.documentElement.classList.add("no-site");
  </script>
  <style>
    .no-site, .no-site body { width: 100%; height: 100%; margin: 0; }
    .no-site body { padding: 0; gap: 0; background: #000; position: relative; }
    .no-site #tela {
      width: min(100vw, calc(100vh * 16 / 9));
      max-width: none;
      height: auto;
      border: 0;
    }
    .no-site .barra {
      position: absolute; right: 12px; bottom: 12px;
      width: auto; max-width: none; opacity: 0.35; transition: opacity 0.2s;
    }
    .no-site .barra:hover, .no-site .barra:focus-within { opacity: 1; }
    .no-site .dica { display: none; }
  </style>
</head>
<body>
  <canvas id="tela" width="1280" height="720" tabindex="0" aria-label="Jogo System Anomaly"></canvas>
  <div class="barra">
    <p class="dica"><b>PC:</b> clique / setas ou WASD para andar · <b>Celular:</b> toque / segure o dedo onde quer ir</p>
    <div class="botoes">
      <button id="btnSom" type="button">SOM: LIGADO</button>
      <button id="btnTela" type="button">TELA CHEIA</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
